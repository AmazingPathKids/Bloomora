name: CI

on:
  push:
    branches: [main, mvp, develop]
  pull_request:
    branches: [main, mvp]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # FT-009: was pinned to 3.24.0 (Dart 3.5.0), which made every CI
          # run on this repo fail at `flutter pub get` — flutter_lints
          # ^6.0.0 requires Dart ^3.8.0. This had been silently failing on
          # every push to mvp since April with nobody noticing (no branch
          # protection to surface it). Bumped to match the version the
          # local dev toolchain actually uses.
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Create .env for CI (development)
        # pubspec.yaml declares ONLY .env as a Flutter asset — never
        # .env.development/.env.staging/.env.production directly — so a
        # build only ever bundles the one environment it was built for.
        # This job targets development, so only development's (non-secret,
        # public-tier) values are written here. No AI provider key is
        # written — that key is server-only, never bundled into the
        # Flutter app.
        run: |
          cat > .env << EOF
          APP_ENV=development
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check formatting (non-blocking)
        # FT-009: the existing codebase isn't fully `dart format`-clean yet
        # (65/111 files would be touched as of this check), so this can't
        # be a required/blocking check without a separate repo-wide
        # reformat — surfaced here as a visible, non-blocking signal
        # instead of silently skipped or silently forced.
        run: dart format --output=none --set-exit-if-changed lib/ test/
        continue-on-error: true

      - name: Run tests
        run: flutter test --dart-define=APP_ENV=development

  backend:
    name: Backend Type-check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        # vitest.config.ts bakes in fake-but-valid test env values (see
        # that file) — no secrets needed for this job.
        working-directory: backend
        run: npm test

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Create .env for CI (production)
        # This job targets production, but production infra doesn't exist
        # yet — .env stays a clearly-marked placeholder rather than
        # silently reusing dev secrets (see docs/audit-findings.md FT-001).
        # `flutter build` only compiles; it doesn't run the app, so the
        # placeholder values don't fail this step — the app's own
        # fail-fast check only matters when the built app is actually run.
        # Only production's values are ever written here — this job never
        # sees dev secrets, so a production build can't bundle them.
        run: |
          cat > .env << 'EOF'
          APP_ENV=production
          API_BASE_URL=https://REPLACE_WITH_PRODUCTION_API_URL
          SUPABASE_URL=https://REPLACE_WITH_PRODUCTION_PROJECT.supabase.co
          SUPABASE_ANON_KEY=REPLACE_WITH_PRODUCTION_ANON_KEY
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=production

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Create .env for CI (production)
        # Same rationale as the iOS job above: production infra doesn't
        # exist yet, so .env stays a placeholder; only production's values
        # are ever written here, so this job never sees dev secrets.
        run: |
          cat > .env << 'EOF'
          APP_ENV=production
          API_BASE_URL=https://REPLACE_WITH_PRODUCTION_API_URL
          SUPABASE_URL=https://REPLACE_WITH_PRODUCTION_PROJECT.supabase.co
          SUPABASE_ANON_KEY=REPLACE_WITH_PRODUCTION_ANON_KEY
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release --dart-define=APP_ENV=production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloomora-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk